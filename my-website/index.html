<style>
  /* Container Styling */
  #moviedome-chat-container {
    background: rgba(10, 8, 15, 0.85);
    border: 1px solid #3a1c1c;
    border-radius: 8px;
    box-shadow: 0 0 20px rgba(150, 30, 30, 0.25);
    overflow: hidden;
    max-width: 800px;
    margin: 2rem auto;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  }

  /* Chat Header */
  #tlkio-chat .header {
    background: linear-gradient(90deg, #8c0a1d 0%, #5a0a1d 100%) !important;
    padding: 12px 15px !important;
    border-bottom: 2px solid #c92a2a !important;
    text-align: center !important;
  }
  
  #tlkio-chat .header h1 {
    color: #f8f0ff !important;
    font-weight: 600 !important;
    font-size: 1.3rem !important;
    text-shadow: 0 0 10px rgba(255, 200, 200, 0.5) !important;
    letter-spacing: 1px !important;
    text-transform: uppercase !important;
    margin: 0 !important;
    font-family: 'Segoe UI', sans-serif !important;
  }

  /* Message Area */
  #tlkio-chat #messages {
    background: #0a080f !important;
    color: #e0d6ff !important;
  }
  
  #tlkio-chat .message {
    border-bottom: 1px dashed #3a1c1c !important;
    padding: 8px 12px !important;
  }
  
  #tlkio-chat .message .nick {
    color: #ff8c8c !important;
    font-weight: 600 !important;
    margin-right: 8px !important;
  }
  
  #tlkio-chat .message.own {
    background: rgba(102, 20, 40, 0.3) !important;
  }

  /* Input Area */
  #tlkio-chat #footer {
    background: #150e1d !important;
    border-top: 1px solid #5a0a1d !important;
    padding: 10px !important;
  }
  
  #tlkio-chat #messagebox {
    background: #1e152a !important;
    border: 1px solid #5a0a1d !important;
    color: #f0e6ff !important;
    border-radius: 4px !important;
    padding: 8px 12px !important;
    font-family: 'Segoe UI', sans-serif !important;
  }
  
  #tlkio-chat #send-button {
    background: linear-gradient(90deg, #8c0a1d 0%, #c92a2a 100%) !important;
    color: white !important;
    border: none !important;
    border-radius: 4px !important;
    padding: 8px 15px !important;
    font-weight: 600 !important;
    text-transform: uppercase !important;
    letter-spacing: 0.5px !important;
    transition: all 0.3s ease !important;
    box-shadow: 0 2px 5px rgba(138, 5, 25, 0.4) !important;
  }
  
  #tlkio-chat #send-button:hover {
    transform: translateY(-1px) !important;
    box-shadow: 0 4px 8px rgba(138, 5, 25, 0.6) !important;
    background: linear-gradient(90deg, #a50c22 0%, #e03a3a 100%) !important;
  }

  /* User List */
  #tlkio-chat #users {
    background: rgba(21, 14, 29, 0.9) !important;
    border-left: 1px solid #5a0a1d !important;
  }
  
  #tlkio-chat #userlist .user {
    color: #d4aaff !important;
    border-bottom: 1px solid rgba(90, 10, 29, 0.5) !important;
  }
  
  #tlkio-chat #userlist .user:hover {
    background: rgba(138, 5, 25, 0.3) !important;
  }

  /* System Messages */
  #tlkio-chat .info {
    color: #ff9e9e !important;
    font-style: italic !important;
  }

  /* Scrollbar */
  #tlkio-chat ::-webkit-scrollbar {
    width: 8px !important;
  }
  
  #tlkio-chat ::-webkit-scrollbar-track {
    background: #0a080f !important;
  }
  
  #tlkio-chat ::-webkit-scrollbar-thumb {
    background: #5a0a1d !important;
    border-radius: 4px !important;
  }
  
  #tlkio-chat ::-webkit-scrollbar-thumb:hover {
    background: #8c0a1d !important;
  }
</style>

<script>

      }

    document.body.appendChild(script);
  });
