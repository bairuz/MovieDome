<style>
    .message {
        max-width: 85%;
        padding: 12px 16px;
        border-radius: 8px;
        margin-bottom: 8px;
        font-size: 14px;
        line-height: 1.4;
        animation: fadeIn 0.2s;
    }
    
    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(5px); }
        to { opacity: 1; transform: translateY(0); }
    }
    
    .bot {
        align-self: flex-start;
        background: rgba(30, 30, 40, 0.6);
        border: 1px solid rgba(100, 100, 120, 0.2);
        border-bottom-left-radius: 4px;
    }
    
    .user {
        align-self: flex-end;
        background: rgba(229, 9, 20, 0.85);
        color: white;
        border-bottom-right-radius: 4px;
    }
    
    .message-time {
        font-size: 11px;
        color: #777;
        margin-top: 4px;
        text-align: right;
    }
    
    .bot .message-time {
        text-align: left;
        color: #888;
    }
    
    .chat-toggle:hover {
        transform: scale(1.05);
        box-shadow: 0 6px 25px rgba(229, 9, 20, 0.7);
    }
    
    .send-btn:hover {
        background: #ff1a26;
        transform: scale(1.05);
    }
    
    .close-chat:hover {
        background: rgba(100, 100, 120, 0.2);
        color: #fff;
    }
    
    /* Scrollbar styling to match site */
    .messages-area::-webkit-scrollbar {
        width: 6px;
    }
    .messages-area::-webkit-scrollbar-track {
        background: rgba(30, 30, 40, 0.3);
        border-radius: 10px;
    }
    .messages-area::-webkit-scrollbar-thumb {
        background: #e50914;
        border-radius: 10px;
    }
    .messages-area::-webkit-scrollbar-thumb:hover {
        background: #ff1a26;
    }
</style>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        const chatContainer = document.querySelector('.chat-container');
        const chatToggle = document.querySelector('.chat-toggle');
        const closeChat = document.querySelector('.close-chat');
        const sendBtn = document.querySelector('.send-btn');
        const messageInput = document.querySelector('.chat-input input');
        const messagesArea = document.querySelector('.messages-area');
        
        chatToggle.addEventListener('click', () => {
            chatContainer.style.display = 'flex';
            chatToggle.style.display = 'none';
        });
        
        closeChat.addEventListener('click', () => {
            chatContainer.style.display = 'none';
            chatToggle.style.display = 'flex';
        });
        
        function sendMessage() {
            const message = messageInput.value.trim();
            if (!message) return;
            
            // Add user message
            addMessage(message, 'user');
            messageInput.value = '';
            
            // Auto-scroll to bottom
            messagesArea.scrollTop = messagesArea.scrollHeight;
            
            // Simulate bot response after delay
            setTimeout(() => {
                const responses = [
                    "🎬 I'd recommend checking out our <strong>Sci-Fi</strong> section for hidden gems!",
                    "🔍 Looking for something specific? Try our advanced filters!",
                    "🆕 New releases update every Thursday at midnight!",
                    "⭐ Did you know you can create watchlists to save movies for later?"
                ];
                const randomResponse = responses[Math.floor(Math.random() * responses.length)];
                addMessage(randomResponse, 'bot');
            }, 800);
        }
        
        sendBtn.addEventListener('click', sendMessage);
        messageInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendMessage();
        });
        
        function addMessage(content, sender) {
            const messageDiv = document.createElement('div');
            messageDiv.classList.add('message', sender);
            
            const now = new Date();
            const timeString = `${now.getHours().toString().padStart(2, '0')}:${now.getMinutes().toString().padStart(2, '0')}`;
            
            messageDiv.innerHTML = `
                <div>${content}</div>
                <div class="message-time">${timeString}</div>
            `;
            
            messagesArea.appendChild(messageDiv);
            messagesArea.scrollTop = messagesArea.scrollHeight;
        }
        
        // Add initial bot message
        setTimeout(() => {
            addMessage("Hey there! 💫 I'm your MovieDome assistant. How can I help you find your next favorite film?", 'bot');
        }, 300);
    });
</script>
